
set  -g default-terminal "tmux-256color"

# this makes alt + u the prefix combination
# to install plugins use alt + u + i
unbind C-b
set-option -g prefix M-u
bind-key M-u send-prefix

bind -n M-c new-window -c '#{pane_current_path}'

# switch windows, alt + n or alt + p
bind -n M-n next-window
bind -n M-p previous-window

bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# resize pane, alt + shift + arrow keys
bind -n M-S-Left resize-pane -L 1
bind -n M-S-Down resize-pane -D 1
bind -n M-S-Up resize-pane -U 1
bind -n M-S-Right resize-pane -R 1

# split pane, alt + h (horizontal), alt + v (vertical)
bind -n M-h split-window -h -c '#{pane_current_path}'
bind -n M-v split-window -v -c '#{pane_current_path}'

# kill pane, alt + q
bind -n M-q killp

set-option -g mouse on
set -g set-clipboard on

# scrollback buffer
set -g history-limit 10000

# increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' every second (default 15s)
set -g status-interval 1

# set window notifications
set -g monitor-activity on
set -g visual-activity on

# makes escape key to not have a delay
set -sg escape-time 0
set -g focus-events on

# Catppuccin Mocha theme colors
thm_bg="#11111b" # crust
thm_fg="#cdd6f4" # text
thm_cyan="#89dceb" # sky
thm_black="#181825" # mantle
thm_gray="#45475a" # surface 1
thm_magenta="#cba6f7" # mauve
thm_pink="#f5c2e7" # pink
thm_red="#f38ba8" # red
thm_green="#a6e3a1" # green
thm_yellow="#f9e2af" # yellow
thm_blue="#89b4fa" # blue
thm_orange="#fab387" # peach
thm_black4="#585b70" # surface 2

# theme
set -g status-position bottom
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"
# messages
set -g message-style fg="${thm_cyan}",bg="${thm_gray}",align="centre"
set -g message-command-style fg="${thm_cyan}",bg="${thm_gray}",align="centre"
# panes
set -g pane-border-style fg="${thm_gray}"
set -g pane-active-border-style fg="${thm_blue}"
setw -g pane-border-format '─'
# windows
setw -g window-status-activity-style fg="${thm_fg}",bg="${thm_bg}",none
setw -g window-status-separator ""
setw -g window-status-style fg="${thm_fg}",bg="${thm_bg}",none

# status line 
# window label: the pane title (Claude Code / opencode set it to the current task),
# or the directory name when the pane is just a shell
# agy (Antigravity) doesn't set a pane title, so read its current conversation title
win_label="#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{?#{==:#{pane_current_command},agy},#($HOME/dotfiles/tmux/tmux-agy-title #{pane_pid} #{pane_current_path}),#{=/30/…:pane_title}}}"
setw -g window-status-format "#[fg=$thm_black4,bg=$thm_bg] ${win_label} #[fg=$thm_fg,bg=$thm_gray] #I "
setw -g window-status-current-format "#[fg=$thm_bg,bg=$thm_blue,bold] ▶ ${win_label} #[fg=$thm_bg,bg=$thm_orange,bold] #I "

set -g status-left ""
status_sh="$HOME/dotfiles/tmux/status.sh"
spotify="#[fg=$thm_bg,bg=$thm_green]#($status_sh spotify)#[]"
pomodoro="#[fg=$thm_gray,bg=$thm_magenta]#($status_sh pomo)#[]"
cpu="#[fg=$thm_fg,bg=$thm_gray]#($status_sh cpu)#[]"
memory="#[fg=$thm_gray,bg=$thm_magenta]#($status_sh memory)#[]"
gpu="#[fg=$thm_fg,bg=$thm_gray]#($status_sh gpu)#[]"
# email of the active pane's repo (follows ~/.gitconfig includeIf rules)
github="#[fg=$thm_gray,bg=$thm_magenta]#($status_sh email '#{pane_current_path}')#[]"
set -g status-right "${github}${cpu}${memory}${gpu}${spotify}${pomodoro}"

