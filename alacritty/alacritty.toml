general.import = ["~/.config/alacritty/catppuccin-mocha.toml"]

[env]
LANG = "en_US.UTF-8"
TERM = "xterm-256color"

[font]
size = 10

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[window]
startup_mode = "Maximized"

[window.padding]
x = 20
y = 20
